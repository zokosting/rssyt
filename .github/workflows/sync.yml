name: Sync YouTube Podcast

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias del sistema (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar Deno (runtime JS para yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Instalar dependencias de Python
        run: |
          pip install --upgrade yt-dlp
          pip install --upgrade bgutil-ytdlp-pot-provider

      - name: Decodificar cookies de YouTube
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES_B64 }}" | base64 -d > /tmp/cookies.txt
          chmod 600 /tmp/cookies.txt
          wc -c /tmp/cookies.txt   # verifica que tiene contenido

      - name: Ejecutar youtubecast
        env:
          YTDLP_COOKIES_FILE: /tmp/cookies.txt
        run: |
          echo "=== Contenido del directorio antes de ejecutar ==="
          ls -la
          echo "=== Versiones ==="
          python --version
          yt-dlp --version
          deno --version
          echo "=== Ejecutando youtubecast ==="
          python youtubecast.py || echo "youtubecast terminó con código $?"
          echo "=== Contenido del directorio después de ejecutar ==="
          ls -la
          ls -la podcasts/ 2>/dev/null || echo "podcasts/ no existe"

      - name: Commit y push de los cambios
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios que commitear"
          else
            git commit -m "Actualización automática del podcast"
            git push
          fi