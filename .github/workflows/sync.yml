name: Sync YouTube Podcast

on:
  schedule:
    # Se ejecuta cada hora en punto
    - cron: '0 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para hacer commit y push de los archivos

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias del sistema (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de Python
        run: |
          pip install yt-dlp
          # Si usas Python < 3.11, instala también tomli
          # pip install tomli

      - name: Ejecutar youtubecast
        run: python youtubecast.py

      - name: Commit y push de los cambios
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add podcasts/ config.toml youtubecast.lock
          # El commit solo se hace si hay cambios
          git commit -m "Actualización automática del podcast" || exit 0
          git push
